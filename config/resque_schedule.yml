drip_campaign_emails:
  cron: '0 11 * * 1-5' # “At 11:00 on every day-of-week from Monday through Friday.”
  class: "DripCampaignJob"
  args:
  description: "This job runs our drip campaigns."
  queue: drip_campaigns
welcome_email:
  every: 30s
  class: "WelcomeEmailJob"
  args:
  description: "This job send welcome message to new user."
  queue: welcome_email
weekly_activity_summary:
  cron: '0 11 * * 1' #“At 11:00 on Monday.”
  class: "WeeklyActivitySummaryJob"
  args:
  description: "This job send weekly activity summary."
  queue: weekly_activity_summary  
