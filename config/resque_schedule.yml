recurring_campaigns: # send email for campaign list
  cron: '5 * * * *'
  class: 'RecurringCampaignJob' # class RecurringCampaignJob is present in app/jobs which represents campaign jobs
  args:
  description: 'Sends campaign to lists of users selected for campaign'
  queue: recurring_campaigns

recurring_reminders: # send email for reminder user
  cron: '5 * * * *'
  class: 'RecurringReminderJob' # class SendReminderJob is present in app/jobs which represents campaign jobs
  args:
  description: 'Sends campaign to lists of users selected for campaign'
  queue: recurring_reminders
