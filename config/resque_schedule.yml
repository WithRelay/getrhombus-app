# every 15 mins to the hour, schedule all campaigns that should run that day
pending_campaigns:
  cron: '45 * * * *'
  class: 'PendingCampaignsJob'
  args:
  description: "Checks for and queues today's upcoming campaigns"
  queue: pending_campaigns

low_account_balance_alert:
  cron: '0 12 * * * America/New_York' # “At 12:00 every day”
  class: 'AccountBalanceAlertJob'
  args:
  description: 'This job alert merchant if their account balance is less than $5'
  queue: low_account_balance_alert

